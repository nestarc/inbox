services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: example
      POSTGRES_PASSWORD: example
      POSTGRES_DB: inbox_examples
    ports:
      - "127.0.0.1:55434:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U example -d inbox_examples"]
      interval: 1s
      timeout: 3s
      retries: 30
  rabbitmq:
    image: rabbitmq:4-management
    ports:
      - "127.0.0.1:55672:5672"
      - "127.0.0.1:55673:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 3s
      timeout: 5s
      retries: 30
